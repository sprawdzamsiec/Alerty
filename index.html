<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://flaticon.com">
<title>Poradnik Bezpieczeństwa</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://onesignal.com" defer></script>
<style>
  :root {
    --bg: #f1f5f9;
    --sidebar-bg: #ffffff;
    --card: #ffffff;
    --text: #0f172a;
    --text-sec: #475569;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --hover: #f8fafc;
    --urgent-bg: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
    --urgent-border: #fb923c;
    --urgent-badge: #ea580c;
    --safe-bg: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    --safe-border: #4ade80;
    --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #090d16;
      --sidebar-bg: #0f172a;
      --card: #162032;
      --text: #f8fafc;
      --text-sec: #cbd5e1;
      --muted: #94a3b8;
      --border: #1e293b;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --hover: #1e293b;
      --urgent-bg: linear-gradient(135deg, rgba(124, 45, 18, 0.45) 0%, rgba(154, 52, 18, 0.25) 100%);
      --urgent-border: #f97316;
      --urgent-badge: #fb923c;
      --safe-bg: linear-gradient(135deg, rgba(20, 83, 45, 0.45) 0%, rgba(22, 101, 52, 0.25) 100%);
      --safe-border: #22c55e;
      --shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .layout {
    display: flex;
    min-height: 100vh;
  }
  /* Lewy panel boczny */
  .sidebar {
    width: 270px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    flex-shrink: 0;
    z-index: 40;
    transition: transform 0.25s ease;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 6px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .shield-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .brand-sub {
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    display: inline-block;
  }
  .nav-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 0 10px 8px;
  }
  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    overflow-y: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-sec);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
  }
  .nav-item:hover {
    background: var(--hover);
    color: var(--text);
  }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
  }
  .nav-count {
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
  }
  .nav-item.active .nav-count {
    background: var(--accent);
    color: #fff;
  }
  .sidebar-footer {
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .side-btn {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .side-btn:hover { border-color: var(--accent); }
  .side-btn.push-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .side-btn.push-subscribed {
    background: rgba(34, 197, 94, 0.15);
    color: #16a34a;
    border-color: rgba(34, 197, 94, 0.4);
  }
  /* Główna część na środku */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .mobile-topbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .menu-toggle {
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    padding: 8px 12px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .content-wrap {
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .top-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .page-heading {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .search-box {
    position: relative;
    flex: 1;
    max-width: 300px;
    min-width: 200px;
  }
  .search-input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--muted);
    pointer-events: none;
  }
  /* Karty wpisów */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 16px;
    align-items: flex-start;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-1px);
  }
  .card.urgent {
    background: var(--urgent-bg);
    border-color: var(--urgent-border);
    border-left: 5px solid var(--urgent-badge);
  }
  .card.safe-card {
    background: var(--safe-bg);
    border-color: var(--safe-border);
  }
  .card-icon-box {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .card.urgent .card-icon-box {
    background: rgba(234, 88, 12, 0.14);
  }
  .card-body {
    flex: 1;
    min-width: 0;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .card.urgent .badge {
    background: rgba(234, 88, 12, 0.16);
    color: var(--urgent-badge);
  }
  .card-time {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 6px;
    line-height: 1.35;
    color: var(--text);
  }
  .card-desc {
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
    color: var(--text-sec);
  }
  .src-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--bg);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    transition: background 0.15s;
  }
  .src-link:hover {
    background: var(--accent-soft);
  }
    .ai-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    vertical-align: middle;
    user-select: none;
  }
  .empty {
    text-align: center;
    padding: 48px 20px;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 16px;
    color: var(--muted);
    font-size: 14.5px;
  }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 35;
    backdrop-filter: blur(2px);
  }
  @media (max-width: 820px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      transform: translateX(-100%);
    }
    .sidebar.open {
      transform: translateX(0);
    }
    .overlay.open {
      display: block;
    }
    .mobile-topbar {
      display: flex;
    }
    .content-wrap {
      padding: 18px 14px 50px;
    }
    .card {
      padding: 15px;
      gap: 12px;
    }
    .card-icon-box {
      width: 38px;
      height: 38px;
      font-size: 19px;
    }
  }
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

<div class="layout">
  <!-- Lewy panel boczny (Menu) -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="shield-icon">🛡️</div>
      <div>
        <div class="brand-title" id="app-title">Poradnik Bezpieczeństwa</div>
        <div class="brand-sub"><span class="live-dot"></span><span id="last-update">Ładowanie...</span></div>
      </div>
    </div>

    <div class="nav-label" id="nav-label">Kategorie</div>
    <nav class="nav-list" id="nav-list"></nav>

    <div class="sidebar-footer">
      <button class="side-btn push-primary" id="push-btn" onclick="enablePush()">🔔 Włącz alerty Push</button>
      <button class="side-btn" id="lang-toggle" onclick="toggleLang()">🌐 Wersja niemiecka (DE)</button>
    </div>
  </aside>

  <!-- Środkowy obszar z wynikami -->
  <main class="main-area">
    <div class="mobile-topbar">
      <button class="menu-toggle" onclick="toggleSidebar(true)">☰ Menu</button>
      <div style="font-weight:800; font-size:15px;">🛡️ Bezpieczeństwo</div>
      <button class="menu-toggle" onclick="toggleLang()" id="mobile-lang">DE 🇩🇪</button>
    </div>

    <div class="content-wrap">
      <div class="top-toolbar">
        <h1 class="page-heading" id="section-heading">🔥 Wszystkie alerty</h1>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Szukaj (np. BLIK, Lidl, bank)..." oninput="render()">
        </div>
      </div>

      <div id="ai-disclaimer" style="background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; box-shadow: var(--shadow); font-size: 13px; line-height: 1.5; color: var(--text-sec);">
        <span style="display: inline-block; padding: 1px 7px; margin-right: 6px; border-radius: 6px; background: var(--accent-soft); border: 1px solid rgba(37, 99, 235, 0.28); color: var(--accent); font-weight: 800; font-size: 11px; letter-spacing: 0.04em; vertical-align: baseline;">AI</span><span id="ai-disclaimer-text">Strona prywatna dla rodziny. Wszystkie nagłówki i podsumowania są automatycznie redagowane oraz tłumaczone przez AI na podstawie oficjalnych kanałów RSS.</span>
      </div>
      
      <div id="feed"></div>
    </div>
  </main>
</div>

<script>
  let lang = 'PL';
  let currentTab = 'all';
  let db = { updated_at: '', PL: [], DE: [] };
  let isPushSubscribed = false;
  let manualOptOut = localStorage.getItem('push_opted_out') === 'true';

  const TABS = {
    PL: [
      { id: 'all', label: '🔥 Wszystkie' },
      { id: 'advice', label: '⚠️ Zalecenia' },
      { id: 'cyber', label: '🚨 Cyber i Oszustwa' },
      { id: 'food', label: '⚡ Żywność i Awarie' },
      { id: 'law', label: '📜 Prawo (PL/DE)' },
      { id: 'market', label: '📈 Giełda i ETF' },
      { id: 'other', label: '📡 Granice i Fake News' }
    ],
    DE: [
      { id: 'all', label: '🔥 Alle Meldungen' },
      { id: 'advice', label: '⚠️ Empfehlungen' },
      { id: 'cyber', label: '🚨 Cyber & Betrug' },
      { id: 'food', label: '⚡ Lebensmittel & Ausfälle' },
      { id: 'law', label: '📜 Recht (DE/PL)' },
      { id: 'market', label: '📈 Börse & ETFs' },
      { id: 'other', label: '📡 Grenzen & Faktencheck' }
    ]
  };

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "969e9ed4-8872-4592-9f70-a56d382dea9c",
      serviceWorkerParam: { scope: "/Alerty/" },
      serviceWorkerPath: "OneSignalSDKWorker.js",
      notifyButton: { enable: false }
    });
    if (!manualOptOut && (OneSignal.User.PushSubscription.optedIn || Notification.permission === "granted")) {
      isPushSubscribed = true;
    }
    updatePushBtn(isPushSubscribed);
    OneSignal.User.PushSubscription.addEventListener("change", function(event) {
      if (!manualOptOut) {
        isPushSubscribed = event.current.optedIn;
        updatePushBtn(isPushSubscribed);
      }
    });
  });

  async function enablePush() {
    if (isPushSubscribed) {
      isPushSubscribed = false;
      manualOptOut = true;
      localStorage.setItem('push_opted_out', 'true');
      updatePushBtn(false);
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.User.PushSubscription.optOut();
        } catch (e) {
          console.log(e);
        }
      });
      return;
    }

    if (!("Notification" in window)) {
      alert(lang === 'PL'
        ? 'Twoja przeglądarka nie obsługuje powiadomień. Na iPhonie najpierw dodaj stronę do ekranu głównego.'
        : 'Dieser Browser unterstützt keine Push-Benachrichtigungen.');
      return;
    }

    if (Notification.permission === "denied") {
      alert(lang === 'PL'
        ? 'Powiadomienia są zablokowane w ustawieniach Safari. Odblokuj je w: Safari -> Ustawienia -> Witryny -> Powiadomienia.'
        : 'Benachrichtigungen sind in Safari blockiert. Bitte unter Safari -> Einstellungen -> Websites -> Mitteilungen erlauben.');
      return;
    }

    const permission = await Notification.requestPermission();
    if (permission === "granted") {
      manualOptOut = false;
      localStorage.removeItem('push_opted_out');
      isPushSubscribed = true;
      updatePushBtn(true);
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.User.PushSubscription.optIn();
        } catch (e) {
          console.log(e);
        }
      });
    }
  }

  function updatePushBtn(subscribed) {
    const btn = document.getElementById('push-btn');
    if (!btn) return;
    if (subscribed) {
      btn.className = 'side-btn push-subscribed';
      btn.textContent = lang === 'PL' ? '✅ Alerty Push aktywne (Wyłącz)' : '✅ Push-Alerts aktiv (Aus)';
    } else {
      btn.className = 'side-btn push-primary';
      btn.textContent = lang === 'PL' ? '🔔 Włącz alerty Push' : '🔔 Push-Alerts aktivieren';
    }
  }



  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
    document.getElementById('overlay').classList.toggle('open', open);
  }

  async function loadData() {
    try {
      const res = await fetch('dane.json?t=' + Date.now());
      db = await res.json();
      render();
    } catch (e) {
      document.getElementById('feed').innerHTML = '<div class="empty">Oczekiwanie na pierwszą synchronizację danych...</div>';
    }
  }

  function toggleLang() {
    lang = lang === 'PL' ? 'DE' : 'PL';
    render();
  }

  function setTab(id) {
    currentTab = id;
    toggleSidebar(false);
    render();
  }

  function render() {
    const allItems = db[lang] || [];
    const query = (document.getElementById('search-input').value || '').toLowerCase().trim();

    document.getElementById('app-title').textContent = lang === 'PL' ? 'Poradnik Bezpieczeństwa' : 'Sicherheits-Ratgeber';
    document.getElementById('nav-label').textContent = lang === 'PL' ? 'Kategorie' : 'Kategorien';
    document.getElementById('lang-toggle').textContent = lang === 'PL' ? '🇩🇪 Wersja niemiecka (DE)' : '🇵🇱 Polnische Version (PL)';
    document.getElementById('mobile-lang').textContent = lang === 'PL' ? 'DE 🇩🇪' : 'PL 🇵🇱';
    document.getElementById('last-update').textContent = (db.updated_at || '-');
    updatePushBtn(isPushSubscribed);

    document.getElementById('ai-disclaimer-text').innerHTML = lang === 'PL'
      ? '<strong>Informacja:</strong> Strona prywatna dla rodziny. Wszystkie nagłówki i podsumowania są automatycznie redagowane oraz tłumaczone przez AI na podstawie oficjalnych kanałów RSS.'
      : '<strong>Hinweis:</strong> Private Seite für Familie und Freunde. Alle Überschriften und Zusammenfassungen werden automatisch mit AI aus offiziellen RSS-Quellen zusammengestellt und übersetzt.';

    document.getElementById('search-input').placeholder = lang === 'PL'
      ? 'Szukaj (np. BLIK, Lidl, bank)...'
      : 'Suchen (z. B. Bank, Rückruf)...';

    const navEl = document.getElementById('nav-list');
    navEl.innerHTML = TABS[lang].map(t => {
      const count = t.id === 'all'
        ? allItems.length
        : allItems.filter(i => i.cat === t.id).length;
      return `
        <button class="nav-item ${currentTab === t.id ? 'active' : ''}" onclick="setTab('${t.id}')">
          <span>${t.label}</span>
          <span class="nav-count">${count}</span>
        </button>
      `;
    }).join('');

    const activeTabObj = TABS[lang].find(t => t.id === currentTab) || TABS[lang][0];
    document.getElementById('section-heading').textContent = activeTabObj.label;

    const filtered = allItems.filter(item => {
      const matchTab = currentTab === 'all' || item.cat === currentTab;
      const matchQuery = !query ||
        (item.tytul && item.tytul.toLowerCase().includes(query)) ||
        (item.opis && item.opis.toLowerCase().includes(query)) ||
        (item.cat_label && item.cat_label.toLowerCase().includes(query));
      return matchTab && matchQuery;
    });

    const feedEl = document.getElementById('feed');
    if (!filtered.length) {
      feedEl.innerHTML = `<div class="empty">${lang === 'PL' ? '✅ Brak wpisów spełniających kryteria w tej kategorii.' : '✅ Keine Einträge in dieser Kategorie gefunden.'}</div>`;
      return;
    }

    feedEl.innerHTML = filtered.map(item => {
      const isUrgent = item.cat === 'advice';
      const isSafe = item.ikona === '✅';
      const cardClass = isUrgent ? 'card urgent' : (isSafe ? 'card safe-card' : 'card');
      return `
        <article class="${cardClass}">
          <div class="card-icon-box">${item.ikona || '📌'}</div>
          <div class="card-body">
            <div class="card-head">
              <span class="badge">${item.cat_label}</span>
              <span class="card-time">${item.time}</span>
            </div>
            <h2 class="card-title">${item.tytul}</h2>
            <p class="card-desc">${item.opis}<span class="ai-tag" title="${lang === 'PL' ? 'Automatycznie redagowane i tłumaczone przez AI' : 'Automatisch mit AI zusammengestellt und übersetzt'}">AI</span></p>
            ${item.link ? `<a class="src-link" href="${item.link}" target="_blank" rel="noopener">${lang === 'PL' ? 'Czytaj źródło ↗' : 'Quelle lesen ↗'}</a>` : ''}
          </div>
        </article>
      `;
    }).join('');
  }

  loadData();
</script>
</body>
</html>
